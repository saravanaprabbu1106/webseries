<!DOCTYPE html>
<html>
<head>
    <title>Login - Movie & Web Series Review Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #173b75 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #4b176b 0%, transparent 35%),
                linear-gradient(135deg, #07152f, #111b4d, #261044);

            color: white;
        }

        .login-card {
            width: 420px;
            padding: 40px;
            border-radius: 20px;

            background: rgba(15, 28, 65, 0.88);
            border: 1px solid rgba(120, 120, 255, 0.35);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(80, 70, 255, 0.15);

            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo span {
            color: #695cff;
        }

        .subtitle {
            text-align: center;
            color: #b9c3df;
            font-size: 14px;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e7eaff;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border: 1px solid #40517f;
            border-radius: 10px;

            background: rgba(25, 42, 82, 0.8);
            color: white;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #685cff;
            box-shadow: 0 0 10px rgba(104, 92, 255, 0.3);
        }

        input::placeholder {
            color: #8995b5;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(90deg, #5555ff, #763cff);
            color: white;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(90, 70, 255, 0.4);
        }

        .messages {
            text-align: center;
            margin-bottom: 20px;
        }

        .messages p {
            color: #ff8f8f;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #aeb9d5;
        }

        .register a {
            color: #7468ff;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            Movie<span>Verse</span>
        </div>

        <div class="subtitle">
            Movies & Webseries Review & Rating Platform
        </div>

        <h1>Login</h1>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" autocomplete="off">

            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="off"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </div>

    </div>

</body>
</html>
