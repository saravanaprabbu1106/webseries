<!DOCTYPE html>
<html>
<head>
    <title>Login - Movie & Web Series Review Platform</title>
</head>

<body>

    <h1>Login</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" autocomplete="off">

        {% csrf_token %}

        <div>
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="off"
                placeholder="Enter your username"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                placeholder="Enter your password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</body>
</html>
