<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies & Web Series Review & Rating Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

<nav class="navbar navbar-dark bg-black shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            🎬 Movie Review & Rating Platform
        </a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-white mb-4">Latest Movies & Web Series</h2>

    <div class="row">

        {% for movie in movies %}

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                {% if movie.poster %}
                <img src="{{ movie.poster.url }}" class="card-img-top" height="350">
                {% endif %}

                <div class="card-body">

                    <h4>{{ movie.title }}</h4>

                    <span class="badge bg-primary">
                        {{ movie.genre }}
                    </span>

                    <p class="mt-3">
                        {{ movie.description|truncatewords:20 }}
                    </p>

                    <button class="btn btn-warning">
                        ⭐ View Reviews
                    </button>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="text-center text-white">
            <h3>No Movies Available</h3>
            <p>Add movies from the Django Admin Panel.</p>
        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
